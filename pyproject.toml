[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["frontend", ".venv", "eval/cache", "eval/results"]

[tool.ruff.lint]
# Defaults (E4, E7, E9, F) are enough for a first gate: syntax errors, unused or
# undefined names, bad imports. Add rule sets later in their own commit.
select = ["E4", "E7", "E9", "F"]
